name: 08 Network Traffic Analyzer CI

on:
  push:
    paths:
      - "08-Network-Traffic-Analyzer/**"
      - ".github/workflows/08-network-traffic-analyzer.yml"
  pull_request:
    paths:
      - "08-Network-Traffic-Analyzer/**"
      - ".github/workflows/08-network-traffic-analyzer.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: 08-Network-Traffic-Analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Byte-compile sources
        run: python -m compileall -q core main.py
      - name: Run unit tests
        run: python -m pytest -q