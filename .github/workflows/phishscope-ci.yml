name: PhishScope CI

on:
  push:
    paths:
      - "10-Phishing-Email-Analyzer/**"
      - ".github/workflows/phishscope-ci.yml"
  pull_request:
    paths:
      - "10-Phishing-Email-Analyzer/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: 10-Phishing-Email-Analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: pip install dnspython requests dkimpy
      - name: Syntax check
        run: python -m compileall -q core gui main.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
